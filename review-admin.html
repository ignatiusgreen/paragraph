<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Review Portal — Paragraph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/review.css">
<style>
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding:4px 10px 20px}
.brand img{height:26px;width:auto;filter:brightness(1.25)}
.brand b{font-size:15px;letter-spacing:.01em}
.nv{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:9px 11px;border-radius:8px;color:var(--muted);font-weight:500;font-size:15px}
.nv:hover{background:var(--card);color:var(--fg)}
.nv.on{background:var(--card2);color:var(--fg)}
.nv svg{flex:none;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nv span.t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nv .n{font-size:12px;color:var(--muted)}
.nv .dot{min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.sh{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6f7078;padding:20px 12px 8px;display:flex;justify-content:space-between;align-items:center}
.sh button{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:0 4px}
.sh button:hover{color:var(--accent)}
.spacer{flex:1}
.main{overflow:auto;padding:30px clamp(18px,3vw,48px) 80px}
.top{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:34px}
.top h1{font-family:"Darker Grotesque","Helvetica Neue",Arial,sans-serif;font-size:clamp(30px,3.2vw,44px);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1;flex:1 1 360px}
.search{position:relative;flex:0 1 280px}
.search input{padding-left:40px;border-radius:8px}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round}
.sec{display:flex;align-items:baseline;gap:12px;margin:8px 0 16px}
.sec h2{font-size:20px;font-weight:600;letter-spacing:-.01em}
.sec span{color:var(--muted);font-size:14px}
.crumb{font-size:14px;color:var(--muted);margin-bottom:10px}
.crumb a{cursor:pointer}.crumb a:hover{color:var(--fg)}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-bottom:38px}
.folder{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:14px;min-height:150px;transition:border-color .15s,transform .15s;position:relative}
.folder:hover{border-color:#4a4b53;transform:translateY(-2px)}
.folder .ic{width:40px;height:40px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.folder .ic svg{width:24px;height:24px;stroke:var(--accent-ink);fill:none;stroke-width:1.8;stroke-linejoin:round}
.folder b{font-size:18px;font-weight:600;line-height:1.2}
.folder small{color:var(--muted);font-size:13px}
.folder .badge{position:absolute;top:18px;right:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 16px;cursor:pointer;transition:border-color .15s,transform .15s}
.card:hover{border-color:#4a4b53;transform:translateY(-2px)}
.card .meta{padding:14px 6px 0}
.card .meta b{display:block;font-size:16px;font-weight:600;line-height:1.25}
.card .meta small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.card .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.empty{color:var(--muted);padding:40px 0;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(5,5,6,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;z-index:50;overflow:auto}
.md{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:540px;padding:24px;max-height:calc(100vh - 40px);overflow:auto}
.md.wide{max-width:900px}
.md h3{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-bottom:18px}
.md .stack{display:flex;flex-direction:column;gap:12px}
.md .btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px}
.seg{display:flex;background:var(--card);border-radius:9px;padding:3px;gap:3px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;border-radius:6px;padding:7px 12px;font-weight:500;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin-bottom:-4px}
.hint{font-size:13px;color:var(--muted);line-height:1.4}
.dh{display:flex;gap:18px;align-items:flex-start;margin-bottom:20px}
.dh .vid-thumb{width:220px;flex:none}
.dh h3{margin:0 0 6px}
.linkrow{display:flex;gap:10px;margin:16px 0}
.linkrow input{flex:1}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.req{background:rgba(244,228,94,.08);border:1px solid rgba(244,228,94,.35);border-radius:var(--r2);padding:16px;margin:14px 0}
.req b{display:block;margin-bottom:4px}
.req p{color:var(--muted);font-size:14px;margin-bottom:12px}
.nt{border-top:1px solid var(--line);padding:14px 0;display:flex;gap:12px}
.nt .c{flex:1;min-width:0}
.nt.done .nb{opacity:.45;text-decoration:line-through}
.nt .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.nt .hd b{font-weight:600}
.nt .tc{background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:1px 7px;font-size:12px;font-weight:700}
.nt .tc.gen{background:var(--card2);color:var(--muted)}
.nt .nb{margin-top:5px;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.nt .na{display:flex;gap:16px;margin-top:6px}
.nt .na button{background:none;border:0;color:var(--muted);font-size:13px;font-weight:600;padding:0}
.nt .na button:hover{color:var(--fg)}
.nt .na .del:hover{color:var(--bad)}
.nt.reply{border-top:0;margin-left:44px;padding:8px 0 0}
.rpl{display:flex;gap:8px;margin-top:10px}
.rpl input{flex:1}
@media(max-width:860px){.shell{grid-template-columns:1fr;height:auto}.side{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}.sh{display:none}.main{overflow:visible}.dh{flex-direction:column}.dh .vid-thumb{width:100%}}

.sw{position:relative;margin:6px 0 16px}
.swb{display:flex;align-items:center;gap:16px;width:100%;border:0;background:none;padding:10px 14px;border-radius:8px;text-align:left}
.swb:hover{background:var(--card2)}
.swb img{height:26px;margin-left:2px;width:auto;filter:brightness(1.25)}
.swb b{font-size:15px;font-weight:600;flex:1}
.swb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;opacity:.6}
.swm{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px;z-index:30;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.swm button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:8px 10px;border-radius:7px;text-align:left;font-size:14px}
.swm button:hover{background:var(--card2)}
.swm button.on:after{content:'✓';margin-left:auto;color:var(--accent)}
.prog{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:var(--accent)}
.sv{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
.sv:hover{border-color:#55565e}
.sv b{font-size:14px;font-weight:600;line-height:1.25}
.sv small{color:var(--muted);font-size:12px}
.sv .vid-thumb{margin-bottom:4px}
.sv .ph{display:grid;place-items:center;height:100%;color:var(--muted);font-size:12px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:26px}
.atiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0 26px}
.atile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.atile small{display:block;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.atile b{font-size:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.abars{display:flex;align-items:flex-end;gap:5px;height:120px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:28px}
.abars i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-width:3px}
.abars i.z{background:var(--card2)}
.atable{width:100%;border-collapse:collapse;font-size:14px}
.atable th{text-align:left;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:8px 12px;border-bottom:1px solid var(--line)}
.atable td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.atable tr{cursor:pointer}.atable tbody tr:hover{background:var(--panel)}
.atable .n{text-align:right;font-variant-numeric:tabular-nums}
.atable small{display:block;color:var(--muted);font-size:12px}

.rlist{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rrow{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.rrow:last-child{border-bottom:0}
.rrow b{font-size:15px;font-weight:600;display:block}
.rrow small{color:var(--muted);font-size:13px}
.rform{display:grid;grid-template-columns:2fr 1fr auto;gap:12px;align-items:center;margin-bottom:14px;max-width:820px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);white-space:nowrap}
.rorder{list-style:none;max-width:820px;display:flex;flex-direction:column;gap:6px}
.rorder li{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:8px 12px;cursor:grab}
.rorder li.drag{opacity:.4}
.rorder .n{width:22px;color:var(--accent);font-weight:700;font-size:13px}
.rorder .t{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rorder .mv{display:flex;gap:4px}
.rorder .mv button{background:var(--card2);border:0;border-radius:5px;width:26px;height:26px;font-size:14px}
.rorder .mv button:hover{background:#31323a}
.sv.sel{border-color:var(--accent)}
.vid-thumb{position:relative}
.vid-thumb .pick{position:absolute;top:8px;left:8px;min-width:24px;height:24px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700;display:grid;place-items:center;padding:0 6px}
@media(max-width:700px){.rform{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
</div>
<script>
(function(){
  /* ---------- helpers ---------- */
  function h(tag,attrs,kids){var e=document.createElement(tag);attrs=attrs||{};
    Object.keys(attrs).forEach(function(k){var v=attrs[k];if(v==null||v===false)return;
      if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);else if(k==='html')e.innerHTML=v;else e.setAttribute(k,v===true?'':v);});
    (kids||[]).forEach(function(c){if(c==null||c===false)return;e.appendChild(typeof c==='string'?document.createTextNode(c):c);});return e;}
  var ICON={
    grid:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>',
    bell:'<svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>',
    folder:'<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
    search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
    reel:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>',
    archive:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8M10 12h4"/></svg>',
    chart:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
    out:'<svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>'};
  function mmss(s){s=Math.floor(s);var m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0');}
  function ago(iso){var d=(Date.now()-new Date(iso).getTime())/1000;if(d<60)return 'just now';if(d<3600)return Math.floor(d/60)+' min ago';if(d<86400)return Math.floor(d/3600)+' hr ago';return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric'});}
  var COLORS=['#f4e45e','#9ad7c5','#f2a98f','#a8b6f0','#e6a8d6','#b8dc8a'];
  function avatar(name){var s=0;for(var i=0;i<name.length;i++)s=(s*31+name.charCodeAt(i))|0;var a=h('div',{class:'av',text:(name.trim()[0]||'?').toUpperCase()});a.style.background=COLORS[Math.abs(s)%COLORS.length];return a;}
  function call(method,body,q){return fetch('/api/review-admin'+(q||''),{method:method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Something went wrong.');return j;});});}
  function linkFor(r){return location.origin+'/review/r/'+r.token;}
  function copy(text,btn){var o=btn.textContent;(navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(function(){btn.textContent='Copied';setTimeout(function(){btn.textContent=o;},1500);}).catch(function(){window.prompt('Copy this:',text);});}

  /* ---------- state ---------- */
  var S={projects:[],reviews:[],view:'all',q:'',notes:{},section:'review',site:[],reels:[],rsel:{id:null,title:'',client:'',ids:[],dl:true},rq:'',menu:false};
  var side=document.getElementById('side'),main=document.getElementById('main');
  function projOf(id){return S.projects.filter(function(p){return p.id===id;})[0];}
  function inProj(id){return S.reviews.filter(function(r){return r.project_id===id;});}
  function pending(){return S.reviews.filter(function(r){return r.request_status==='pending';});}
  function load(){return Promise.all([call('GET'),call('GET',null,'?site=1').catch(function(){return {videos:[]};}),call('GET',null,'?reels=1').catch(function(){return {reels:[]};})]).then(function(r){S.projects=r[0].projects;S.reviews=r[0].reviews;S.site=r[1].videos||[];S.reels=r[2].reels||[];draw();}).catch(function(e){main.innerHTML='';main.appendChild(h('p',{class:'msg err',text:e.message}));});}

  /* ---------- sidebar ---------- */
  function nav(id,icon,label,count,dot){
    return h('button',{class:'nv'+(S.view===id?' on':''),type:'button',onclick:function(){S.view=id;S.q='';draw();}},[h('span',{html:icon,style:'display:flex'}),h('span',{class:'t',text:label}),dot?h('span',{class:'dot',text:String(dot)}):(count!=null?h('span',{class:'n',text:String(count)}):null)]);
  }
  function drawSide(){
    side.innerHTML='';
    var names={review:'Review Portal',site:'Website Videos'};
    var sw=h('div',{class:'sw'},[h('button',{class:'swb',type:'button','aria-haspopup':'true',onclick:function(e){e.stopPropagation();S.menu=!S.menu;drawSide();}},[h('img',{src:'https://images.squarespace-cdn.com/content/v1/659dbf35c403a37668fc103f/1d1ecc1e-95c4-476b-9223-124c816f6cbd/%C2%B6_v1.png?format=300w',alt:''}),h('b',{text:names[S.section]}),h('span',{html:'<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',style:'display:flex'})])]);
    if(S.menu){var mm=h('div',{class:'swm'});['review','site'].forEach(function(k){mm.appendChild(h('button',{type:'button',class:S.section===k?'on':'',text:names[k],onclick:function(){S.section=k;S.menu=false;S.q='';S.view=k==='site'?'site:all':'all';draw();}}));});sw.appendChild(mm);}
    side.appendChild(sw);
    if(S.section==='site'){
      var done=S.site.filter(function(v){return v.video_url;}).length,tot=S.site.length;
      side.appendChild(nav('site:all',ICON.grid,'All videos',tot));
      side.appendChild(nav('site:Films',ICON.folder,'Films',S.site.filter(function(v){return v.area==='Films';}).length));
      side.appendChild(nav('site:Brands',ICON.folder,'Brands + archive',S.site.filter(function(v){return v.area==='Brands';}).length));
      side.appendChild(nav('site:reels',ICON.reel,'Reel Builder',S.reels.length));
      side.appendChild(nav('site:todo',ICON.bell,'Still on Vimeo',null,tot-done));
      side.appendChild(h('div',{class:'sh'},[h('span',{text:'On Dropbox'}),h('span',{text:done+' / '+tot})]));
      side.appendChild(h('div',{style:'padding:0 12px'},[h('div',{class:'prog'},[h('i',{style:'width:'+(tot?done/tot*100:0)+'%'})])]));
      side.appendChild(h('div',{class:'spacer'}));
      side.appendChild(h('a',{class:'nv',href:'/archive'},[h('span',{html:ICON.archive,style:'display:flex'}),h('span',{class:'t',text:'Archive'})]));
      side.appendChild(h('a',{class:'nv',href:'/archive-logout'},[h('span',{html:ICON.out,style:'display:flex'}),h('span',{class:'t',text:'Sign out'})]));
      return;
    }
    side.appendChild(nav('all',ICON.grid,'All videos',S.reviews.length));
    side.appendChild(nav('requests',ICON.bell,'Note requests',null,pending().length||0));
    side.appendChild(nav('analytics',ICON.chart,'Analytics'));
    side.appendChild(h('div',{class:'sh'},[h('span',{text:'Projects'}),h('button',{type:'button',title:'New project','aria-label':'New project',text:'+',onclick:newProject})]));
    if(!S.projects.length)side.appendChild(h('div',{class:'hint',style:'padding:4px 12px',text:'No projects yet.'}));
    S.projects.forEach(function(p){side.appendChild(nav(p.id,ICON.folder,p.name,inProj(p.id).length));});
    side.appendChild(h('div',{class:'spacer'}));
    side.appendChild(h('a',{class:'nv',href:'/archive'},[h('span',{html:ICON.archive,style:'display:flex'}),h('span',{class:'t',text:'Archive'})]));
    side.appendChild(h('a',{class:'nv',href:'/archive-logout'},[h('span',{html:ICON.out,style:'display:flex'}),h('span',{class:'t',text:'Sign out'})]));
  }

  /* ---------- cards ---------- */
  function thumb(r){
    var v=h('video',{src:r.video_url+(r.video_url.indexOf('#')<0?'#t=0.8':''),preload:'metadata',muted:true,playsinline:true});v.muted=true;
    var t=h('div',{class:'vid-thumb'},[v,h('span',{class:'tag pill '+(r.kind==='presentation'?'':'y'),text:r.kind==='presentation'?'Presentation':'Review'}),r.label?h('span',{class:'ver',text:r.label}):null]);
    return t;
  }
  function vcard(r){
    var p=r.project_id&&projOf(r.project_id);
    var row=h('div',{class:'row'},[
      r.kind==='review'?h('span',{class:'pill',text:r.open+' open · '+r.done+' resolved'}):null,
      r.status==='closed'?h('span',{class:'pill r',text:'Closed'}):null,
      r.request_status==='pending'?h('span',{class:'pill y',text:'Wants to leave notes'}):null]);
    return h('div',{class:'card',onclick:function(){openDetail(r.id);}},[thumb(r),h('div',{class:'meta'},[h('b',{text:r.title}),h('small',{text:[r.client,p&&p.name,'created '+ago(r.created_at)].filter(Boolean).join(' · ')}),row])]);
  }
  function fcard(p){
    var items=inProj(p.id),n=items.filter(function(r){return r.request_status==='pending';}).length;

    sortTops(ns).forEach(function(n){out.push((n.timecode==null?'GENERAL':mmss(n.timecode))+(n.resolved?' [resolved]':'')+' — '+n.author_name+': '+n.body);ns.filter(function(k){return k.parent_id===n.id;}).forEach(function(k){out.push('    ↳ '+k.author_name+': '+k.body);});});return out.join('\n');}
  var openId=null;
  function openDetail(id){openId=id;var r=S.reviews.filter(function(x){return x.id===id;})[0];if(!r)return;
    if(r.kind==='review'&&!S.notes[id])call('GET',null,'?id='+id).then(function(j){S.notes[id]=j.notes;if(openId===id)renderDetail();});
    renderDetail();}
  function refresh(id){return call('GET').then(function(j){S.projects=j.projects;S.reviews=j.reviews;drawSide();drawMain();return call('GET',null,'?id='+id);}).then(function(j){S.notes[id]=j.notes;if(openId===id)renderDetail();});}
  function renderDetail(){
    var r=S.reviews.filter(function(x){return x.id===openId;})[0];if(!r){closeModal();return;}
    var scroll=cur&&cur.firstChild?cur.firstChild.scrollTop:0;
    var p=r.project_id&&projOf(r.project_id);
    var head=h('div',{class:'dh'},[thumb(r),h('div',{style:'min-width:0'},[h('h3',{text:r.title}),h('div',{class:'msg',text:[r.client,p&&p.name,r.label].filter(Boolean).join(' · ')||'No project'}),
      h('div',{style:'margin-top:10px;display:flex;gap:8px;flex-wrap:wrap'},[h('span',{class:'pill '+(r.kind==='review'?'y':''),text:r.kind==='review'?'Review':'Presentation'}),h('span',{class:'pill '+(r.status==='open'?'o':'r'),text:r.status==='open'?'Open':'Closed'})])])]);
    var inp=h('input',{class:'field',readonly:true,value:linkFor(r)});inp.addEventListener('focus',function(){inp.select();});
    var cp=h('button',{class:'btn pri',type:'button',text:'Copy link'});cp.addEventListener('click',function(){copy(linkFor(r),cp);});
    var lr=h('div',{class:'linkrow'},[inp,cp,h('a',{class:'btn ghost',href:linkFor(r),target:'_blank',rel:'noopener',text:'Open'})]);
    var ac=h('div',{class:'acts'});
    function act(label,fn,cls){ac.appendChild(h('button',{class:'btn ghost sm '+(cls||''),type:'button',text:label,onclick:fn}));}
    act(r.kind==='review'?'Switch to presentation':'Switch to review (notes on)',function(){call('POST',{action:'update',id:r.id,kind:r.kind==='review'?'presentation':'review'}).then(function(){return refresh(r.id);});});
    act(r.status==='open'?'Close':'Reopen',function(){call('POST',{action:'update',id:r.id,status:r.status==='open'?'closed':'open'}).then(function(){return refresh(r.id);});});
    act('Move to project…',function(){moveDlg(r);});
    act('Rename',function(){var v=prompt('Title:',r.title);if(v&&v!==r.title)call('POST',{action:'update',id:r.id,title:v}).then(function(){return refresh(r.id);}).catch(function(e){alert(e.message);});});
    act('Version label',function(){var v=prompt('Version label (e.g. v3, Final):',r.label||'');if(v!==null)call('POST',{action:'update',id:r.id,label:v}).then(function(){return refresh(r.id);});});
    act('Change video link',function(){var v=prompt('New direct link to the video:',r.video_url);if(v&&v!==r.video_url)call('POST',{action:'update',id:r.id,video_url:v}).then(function(){return refresh(r.id);}).catch(function(e){alert(e.message);});});
    if(r.kind==='review')act('Copy all notes',function(e){copy(exportText(r),e.target);});
    act('Delete',function(){if(confirm('Delete “'+r.title+'”'+(r.kind==='review'?' and all its notes':'')+'? This can’t be undone.'))call('POST',{action:'delete',id:r.id}).then(function(){closeModal();openId=null;return load();});},'bad');
    var kids=[head,lr,ac];
    if(r.request_status==='pending'){
      kids.push(h('div',{class:'req'},[h('b',{text:(r.requested_name||'Someone')+' wants to leave notes'}),h('p',{text:[r.requested_email,r.requested_message&&'“'+r.requested_message+'”',r.requested_at&&ago(r.requested_at)].filter(Boolean).join(' · ')}),
        h('div',{style:'display:flex;gap:10px'},[h('button',{class:'btn pri sm',type:'button',text:'Approve — turn on notes',onclick:function(){call('POST',{action:'request',id:r.id,decision:'approve'}).then(function(){S.notes[r.id]=[];return refresh(r.id);});}}),h('button',{class:'btn ghost sm',type:'button',text:'Decline',onclick:function(){call('POST',{action:'request',id:r.id,decision:'decline'}).then(function(){return refresh(r.id);});}})])]));
    }else if(r.request_status==='declined'&&r.kind==='presentation'){kids.push(h('div',{class:'hint',style:'margin:10px 0',text:'You declined a request to leave notes on this video.'}));}
    if(r.kind==='review'){
      var ns=S.notes[r.id];kids.push(h('div',{class:'sec',style:'margin-top:22px'},[h('h2',{text:'Notes'}),h('span',{text:ns?sortTops(ns).length+' total':''})]));
      if(!ns)kids.push(h('div',{class:'msg',text:'Loading notes…'}));
      else if(!sortTops(ns).length)kids.push(h('div',{class:'msg',text:'No notes yet.'}));
      else sortTops(ns).forEach(function(n){kids.push(noteRow(r,n,false));ns.filter(function(k){return k.parent_id===n.id;}).forEach(function(k){kids.push(noteRow(r,k,true));});});
    }else kids.push(h('div',{class:'hint',style:'margin-top:16px',text:'Presentation links show the video with a download button. Notes are off. A viewer can ask to leave notes and you’ll approve it here.'}));
    var m=modal(kids,true);if(scroll)m.scrollTop=scroll;
  }
  function moveDlg(r){
    var ps=projectSelect(r.project_id||''),m=h('span',{class:'msg'});
    modal([h('h3',{text:'Move to project'}),h('div',{class:'stack'},[ps]),h('div',{class:'btns'},[h('button',{class:'btn pri',type:'button',text:'Move',onclick:function(){call('POST',{action:'update',id:r.id,project_id:ps.value||null}).then(function(){return load();}).then(function(){openDetail(r.id);});}}),h('button',{class:'btn ghost',type:'button',text:'Back',onclick:function(){openDetail(r.id);}}),m])]);
  }
  function noteRow(r,n,isReply){
    var hd=h('div',{class:'hd'},[h('b',{text:n.author_name+(n.is_team?' (team)':'')}),!isReply?h('span',{class:'tc'+(n.timecode==null?' gen':''),text:n.timecode==null?'General':mmss(n.timecode)}):null,n.author_email?h('a',{class:'msg',href:'mailto:'+n.author_email,text:n.author_email}):null,h('span',{class:'msg',text:ago(n.created_at)+(n.edited_at?' · edited':'')})]);
    var body=h('div',{class:'c'},[hd,h('div',{class:'nb',text:n.body})]);
    var na=h('div',{class:'na'});
    function bt(label,fn,cls){na.appendChild(h('button',{type:'button',class:cls||'',text:label,onclick:fn}));}
    if(!isReply)bt(n.resolved?'Reopen':'Resolve',function(){call('POST',{action:'resolve',note_id:n.id,resolved:!n.resolved}).then(function(){return refresh(r.id);});});
    if(!isReply)bt('Reply',function(){if(body.querySelector('.rpl'))return;var i=h('input',{class:'field',placeholder:'Reply as Paragraph…',maxlength:'3000'});
      function go(){if(!i.value.trim())return;call('POST',{action:'note',id:r.id,parent_id:n.id,body:i.value}).then(function(){return refresh(r.id);}).catch(function(e){alert(e.message);});}
      i.addEventListener('keydown',function(e){if(e.key==='Enter')go();});body.appendChild(h('div',{class:'rpl'},[i,h('button',{class:'btn pri sm',type:'button',text:'Send',onclick:go})]));i.focus();});
    bt('Delete',function(){if(confirm('Delete this note?'))call('POST',{action:'delete_note',note_id:n.id}).then(function(){return refresh(r.id);});},'del');
    body.appendChild(na);
    return h('div',{class:'nt'+(n.resolved?' done':'')+(isReply?' reply':'')},[avatar(n.author_name),body]);
  }

  load();
})();
</script>
</body></html>
