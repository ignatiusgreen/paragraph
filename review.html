<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Review — Paragraph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/review.css">
<style>
body{display:flex;flex-direction:column;min-height:100%;height:auto}
.bar{display:flex;align-items:center;gap:18px;height:68px;padding:0 clamp(18px,2.8vw,40px);border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
.bar img{height:22px;width:auto;filter:brightness(1.25)}
.bar .sep{color:#4a4b52}
.bar .ttl{font-weight:600;font-size:15px;white-space:nowrap;min-width:0}
.bar .crumb{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}
.bar .sp{flex:1}
.wrap{flex:1;padding:clamp(14px,2vw,28px);max-width:1900px;width:100%;margin:0 auto}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
.cols.has-notes{grid-template-columns:minmax(0,1fr) 340px}
.cols:not(.has-notes) .side{display:none}
.stage{width:100%;max-width:calc((100vh - 270px)*var(--ar,1.7778));margin-left:auto;margin-right:auto}
.vbox{position:relative}
.stage video{display:block;width:100%;aspect-ratio:var(--ar,1.7778);background:#000;border-radius:var(--r);outline:none}
.pbig{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border:0;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 10px 40px rgba(0,0,0,.5);transition:transform .15s,background .15s}
.pbig:hover{transform:scale(1.06);background:#fff17e}
.pbig svg{width:34px;height:34px;fill:currentColor;margin-left:4px}
.pbig[hidden]{display:none}
.strip{position:relative;height:8px;margin:14px 6px 0;background:var(--card2);border-radius:99px;cursor:pointer}
.strip i{position:absolute;top:-3px;width:14px;height:14px;margin-left:-7px;background:var(--accent);border:2px solid var(--bg);border-radius:50%;cursor:pointer}
.strip i.done{background:#5b5c63}
.strip .head{position:absolute;top:-5px;bottom:-5px;width:2px;background:#fff;border-radius:2px;pointer-events:none}
.snote{font-size:13px;color:var(--muted);margin:10px 6px 0;min-height:1em}
.dock{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.dock .who{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dock .who .field{flex:1 1 200px;padding:10px 14px}
.dock .row{display:flex;align-items:flex-start;gap:12px}
.tcp{flex:none;margin-top:9px;background:rgba(244,228,94,.15);color:var(--accent);border-radius:5px;padding:3px 9px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.tcp.gen{background:var(--card2);color:var(--muted)}
.dock textarea{flex:1;background:transparent;border:0;outline:none;resize:none;min-height:44px;max-height:200px;font-size:15px;line-height:1.45;padding:9px 0}
.dock textarea::placeholder{color:#5f6068}
.dock .foot{display:flex;align-items:center;gap:14px;margin-top:8px;border-top:1px solid var(--line);padding-top:12px;flex-wrap:wrap}
.dock .foot label{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;cursor:pointer}
.dock .foot .sp{flex:1}
.dock .as{font-size:13px;color:var(--muted)}
.dock .as a{color:var(--fg);text-decoration:underline;cursor:pointer}
.side{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);position:sticky;top:76px;display:flex;flex-direction:column;max-height:calc(100vh - 96px);overflow:hidden}
.side .hd{display:flex;align-items:center;gap:8px;padding:18px 16px 12px;flex-wrap:wrap}
.side .hd b{font-size:16px;font-weight:700}
.side .hd .ct{background:var(--card2);color:var(--muted);border-radius:5px;padding:1px 7px;font-size:12px;font-weight:600}
.side .hd .sp{flex:1}
.side select{flex:none;background:var(--card2);border:0;border-radius:6px;color:var(--fg);padding:5px 6px;max-width:92px;font-size:12.5px;font-weight:600;outline:none}
.clist{overflow:auto;padding:0 12px 14px;display:flex;flex-direction:column;gap:4px}
.cm{padding:12px 8px;border-radius:8px;display:flex;gap:11px;transition:background .15s}
.cm:hover{background:rgba(255,255,255,.03)}
.cm.cur{background:rgba(244,228,94,.07)}
.cm.done .tx{opacity:.5}
.cm .c{flex:1;min-width:0}
.cm .hd2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cm .hd2 b{font-weight:600;font-size:14px}
.cm .hd2 .w{font-size:12px;color:var(--muted)}
.tc{background:rgba(244,228,94,.15);color:var(--accent);border:0;border-radius:5px;padding:1px 7px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}
.tc.gen{background:var(--card2);color:var(--muted);cursor:default}
.tx{margin-top:4px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.acts{display:flex;gap:14px;margin-top:6px}
.acts button{background:none;border:0;color:var(--muted);font-size:12.5px;font-weight:600;padding:0}
.acts button:hover{color:var(--fg)}
.rep{margin-top:8px;display:flex;flex-direction:column;gap:2px}
.cm.r{padding:8px 0 0}
.cm.r .av{width:24px;height:24px;font-size:11px}
.ed textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:9px 11px;min-height:70px;font-size:14.5px;outline:none;resize:vertical}
.ed .b{display:flex;gap:8px;margin-top:8px;align-items:center}
.nonotes{padding:14px 18px 20px;color:var(--muted);font-size:14px}
.closed{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;color:var(--muted)}
.pres{margin-top:20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pres .sp{flex:1}
.pres h1{font-family:"Darker Grotesque","Helvetica Neue",Arial,sans-serif;font-size:clamp(30px,3.2vw,46px);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1}
.pres .sub{color:var(--muted);font-size:14px;margin-top:2px}
.pres .ask{color:var(--muted);font-size:13px;background:none;border:0;text-decoration:underline;text-underline-offset:3px;padding:6px 4px}
.pres .ask:hover{color:var(--fg)}
.ov{position:fixed;inset:0;background:rgba(5,5,6,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;z-index:50}
.md{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:440px;padding:22px}
.md h3{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.md p{color:var(--muted);font-size:14px;margin-bottom:16px}
.md .stack{display:flex;flex-direction:column;gap:10px}
.md .btns{display:flex;gap:10px;margin-top:16px;align-items:center;flex-wrap:wrap}
.fail{text-align:center;padding:120px 0}
.fail h1{font-family:"Darker Grotesque","Helvetica Neue",Arial,sans-serif;font-size:44px;font-weight:800;text-transform:uppercase;letter-spacing:.01em;margin-bottom:8px}

.cbar{display:flex;align-items:center;gap:12px;margin-top:12px;padding:7px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.cbar button{background:none;border:0;color:var(--fg);width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex:none}
.cbar button:hover{background:var(--card2)}
.cbar svg{width:16px;height:16px;fill:currentColor}
.cbar .t{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cbar .seek{flex:1;position:relative;height:6px;background:var(--card2);border-radius:99px;cursor:pointer}
.cbar .seek:before{content:'';position:absolute;inset:-12px 0}
.cbar .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#6b6c73;border-radius:99px}
.cbar .knob{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;background:#fff;border-radius:50%;left:0;pointer-events:none}
.cbar .seek i{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;background:var(--accent);border:2px solid var(--panel);border-radius:50%;cursor:pointer;z-index:2}
.cbar .seek i.done{background:#5b5c63}
.stage video{cursor:pointer}
.vwrap{position:relative}
.vsw{display:flex;align-items:center;gap:6px;background:var(--card2);border:0;border-radius:7px;padding:5px 10px;font-weight:600;font-size:14px;color:var(--fg)}
.vsw:hover{background:#31323a}
.vsw .chev svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;display:block;opacity:.7}
.vmenu{position:absolute;left:0;top:100%;margin-top:6px;min-width:220px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px;z-index:40;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.vmenu a{display:block;padding:8px 10px;border-radius:7px;font-size:14px;font-weight:500;white-space:nowrap}
.vmenu a:hover{background:var(--card2)}
.vmenu a.on{color:var(--accent)}
.vmenu[hidden]{display:none}
@media(max-width:960px){.cols.has-notes{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none}.stage video{max-height:none}.bar .crumb{display:none}}
</style>
<script src="/hls-play.js"></script></head>
<body>
<div class="bar">
  <a href="/index.html" aria-label="Paragraph home"><img src="https://images.squarespace-cdn.com/content/v1/659dbf35c403a37668fc103f/1d1ecc1e-95c4-476b-9223-124c816f6cbd/%C2%B6_v1.png?format=300w" alt=""></a>
  <span class="sep" id="sep" hidden>/</span><span class="crumb" id="crumb"></span><span class="ttl" id="ttl"></span>
  <span class="sp"></span><span class="pill" id="kind"></span>
</div>
<div class="wrap" id="app"><p class="msg" style="text-align:center;padding:90px 0">Loading…</p></div>
<script>
(function(){
  var token=(location.pathname.match(/\/review\/r\/([^\/?#]+)/)||[])[1]||'';
  var app=document.getElementById('app');
  var S={review:null,notes:[],duration:0,replyOpen:null,editing:null,filter:'all',sort:'time'};
  function h(tag,attrs,kids){var e=document.createElement(tag);attrs=attrs||{};
    Object.keys(attrs).forEach(function(k){var v=attrs[k];if(v==null||v===false)return;
      if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v);});
    (kids||[]).forEach(function(c){if(c==null||c===false)return;e.appendChild(typeof c==='string'?document.createTextNode(c):c);});return e;}
  function mmss(s){s=Math.max(0,Math.floor(s));var hh=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (hh?hh+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0');}
  function ago(iso){var d=(Date.now()-new Date(iso).getTime())/1000;if(d<60)return 'just now';if(d<3600)return Math.floor(d/60)+' min ago';if(d<86400)return Math.floor(d/3600)+' hr ago';return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric'});}
  var COLORS=['#f4e45e','#9ad7c5','#f2a98f','#a8b6f0','#e6a8d6','#b8dc8a'];
  function avatar(name){var s=0;for(var i=0;i<name.length;i++)s=(s*31+name.charCodeAt(i))|0;var a=h('div',{class:'av',text:(name.trim()[0]||'?').toUpperCase()});a.style.background=COLORS[Math.abs(s)%COLORS.length];return a;}
  function store(k,v){try{if(v===undefined)return localStorage.getItem('pgr_'+k)||'';localStorage.setItem('pgr_'+k,v);}catch(e){return '';}}
  function mine(){try{return JSON.parse(localStorage.getItem('pgr_mine_'+token)||'{}');}catch(e){return {};}}
  function keep(id,key){try{var m=mine();m[id]=key;localStorage.setItem('pgr_mine_'+token,JSON.stringify(m));}catch(e){}}
  function api(method,body){
    return fetch('/api/review'+(method==='GET'?'?token='+encodeURIComponent(token):''),{method:method,headers:{'Content-Type':'application/json'},body:method==='GET'?undefined:JSON.stringify(body)})
      .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Something went wrong.');return j;});});
  }
  function track(ev){try{var k='pgt_'+ev+'_'+token;if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1');}catch(e){}
    fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'track',token:token,event:ev}),keepalive:true}).catch(function(){});}
  function fail(msg){app.innerHTML='';app.appendChild(h('div',{class:'fail'},[h('h1',{text:'This link isn’t working'}),h('p',{class:'msg',text:msg})]));}

  var video,strip,snote,listEl,countEl,tcp,ta,genBox,msgEl,nameIn,emailIn,cols;
  function tops(){var f=S.filter;return S.notes.filter(function(n){return !n.parent_id&&(f==='all'||(f==='open'&&!n.resolved)||(f==='done'&&n.resolved));}).sort(function(a,b){
    if(S.sort==='new')return new Date(b.created_at)-new Date(a.created_at);
    var x=a.timecode==null,y=b.timecode==null;if(x!==y)return x?1:-1;if(!x&&a.timecode!==b.timecode)return a.timecode-b.timecode;return new Date(a.created_at)-new Date(b.created_at);});}
  function allTops(){return S.notes.filter(function(n){return !n.parent_id;});}

  function vname(v){return v.label||v.title;}
  function header(){var r=S.review;document.title=(r.project?r.project+' · ':'')+vname(r)+' — Paragraph';
    var cr=document.getElementById('crumb'),sp=document.getElementById('sep'),tt=document.getElementById('ttl');
    cr.textContent=r.project||'';sp.hidden=!r.project;tt.innerHTML='';
    var vs=r.versions||[];
    if(r.kind==='review'&&r.project&&vs.length>1){
      var btn=h('button',{class:'vsw',type:'button','aria-haspopup':'true'},[h('span',{text:vname(r)}),h('span',{class:'chev',html:'<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>'})]);
      var menu=h('div',{class:'vmenu',hidden:true});
      vs.forEach(function(v){menu.appendChild(h('a',{class:v.current?'on':'',href:'/review/r/'+v.token,text:v.label&&v.title&&v.label!==v.title?v.label+' · '+v.title:vname(v)}));});
      btn.addEventListener('click',function(e){e.stopPropagation();menu.hidden=!menu.hidden;});
      document.addEventListener('click',function(){menu.hidden=true;});
      tt.appendChild(h('div',{class:'vwrap'},[btn,menu]));
    }else tt.textContent=r.project?vname(r):r.title+(r.label?'  '+r.label:'');
    var k=document.getElementById('kind');k.textContent=r.kind==='review'?'Review':'Presentation';k.className='pill'+(r.kind==='review'?' y':'');}

  function player(){
    var r=S.review;var stage=h('div',{class:'stage'});
    video=h('video',{playsinline:true,preload:'metadata'});pgAttach(video,r.src||r.video_url,r.video_url);
    var vbox=h('div',{class:'vbox'});vbox.appendChild(video);stage.appendChild(vbox);
    video.addEventListener('loadedmetadata',function(){if(video.videoWidth&&video.videoHeight)stage.style.setProperty('--ar',(video.videoWidth/video.videoHeight).toFixed(4));});
    video.addEventListener('error',function(){if(snote){snote.textContent='This video didn’t load. Try refreshing, or let Paragraph know.';snote.style.color='var(--bad)';}});
    video.addEventListener('play',function(){track('play');});
    return stage;
  }

  function build(){
    var r=S.review;header();app.innerHTML='';
    if(r.kind==='presentation')return buildPresentation();
    cols=h('div',{class:'cols'});app.appendChild(cols);
    var stage=player();cols.appendChild(stage);
    var cb=controls(video);strip=cb.seek;strip.title='Dots mark where comments are.';stage.appendChild(cb);
    snote=h('div',{class:'snote'});stage.appendChild(snote);
    video.addEventListener('loadedmetadata',function(){S.duration=video.duration||0;marks();});
    video.addEventListener('timeupdate',tick);video.addEventListener('seeked',tick);
    
    if(r.status!=='open'){stage.appendChild(h('div',{class:'closed',text:'This review is closed. You can read the comments, but new ones can’t be added.'}));}
    else stage.appendChild(dock());
    var side=h('div',{class:'side'});cols.appendChild(side);
    var fs=h('select',{'aria-label':'Filter'},[h('option',{value:'all',text:'All'}),h('option',{value:'open',text:'Open'}),h('option',{value:'done',text:'Resolved'})]);
    fs.addEventListener('change',function(){S.filter=fs.value;render();});
    var ss=h('select',{'aria-label':'Sort'},[h('option',{value:'time',text:'Time'}),h('option',{value:'new',text:'Newest'})]);
    ss.addEventListener('change',function(){S.sort=ss.value;render();});
    countEl=h('span',{class:'ct'});
    side.appendChild(h('div',{class:'hd'},[h('b',{text:'Comments'}),countEl,h('span',{class:'sp'}),fs,ss]));
    listEl=h('div',{class:'clist'});side.appendChild(listEl);
    render();marks();tick();
  }

  function dock(){
    var d=h('div',{class:'dock'});
    var who=h('div',{class:'who'});
    nameIn=h('input',{class:'field',placeholder:'Your name',autocomplete:'name',maxlength:'80',value:store('name')});
    emailIn=h('input',{class:'field',type:'email',placeholder:'Email (optional)',autocomplete:'email',maxlength:'160',value:store('email')});
    who.appendChild(nameIn);who.appendChild(emailIn);
    var row=h('div',{class:'row'});tcp=h('span',{class:'tcp',text:'0:00'});ta=h('textarea',{placeholder:'Leave your comment…',maxlength:'3000',rows:'1'});
    row.appendChild(tcp);row.appendChild(ta);
    ta.addEventListener('input',function(){ta.style.height='auto';ta.style.height=Math.min(200,ta.scrollHeight)+'px';});
    ta.addEventListener('focus',function(){if(!video.paused&&!genBox.checked)video.pause();tick();});
    ta.addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();submit();}});
    var foot=h('div',{class:'foot'});
    var lab=h('label');genBox=h('input',{type:'checkbox'});lab.appendChild(genBox);lab.appendChild(document.createTextNode('General comment (not tied to a time)'));genBox.addEventListener('change',tick);
    msgEl=h('span',{class:'msg'});
    foot.appendChild(lab);foot.appendChild(msgEl);foot.appendChild(h('span',{class:'sp'}));
    foot.appendChild(h('button',{class:'btn pri',type:'button',text:'Comment',onclick:submit}));
    d.appendChild(who);d.appendChild(row);d.appendChild(foot);return d;
  }

  function marks(){
    if(!strip)return;[].forEach.call(strip.querySelectorAll('i'),function(x){x.remove();});var d=S.duration;if(!d)return;
    allTops().forEach(function(n){if(n.timecode==null)return;var i=h('i',{title:mmss(n.timecode)+' · '+n.author_name});i.style.left=Math.min(100,n.timecode/d*100)+'%';if(n.resolved)i.className='done';
      i.addEventListener('click',function(e){e.stopPropagation();video.currentTime=n.timecode;});strip.appendChild(i);});
  }
  function tick(){
    if(!video)return;var t=video.currentTime||0;
    if(tcp){var g=genBox&&genBox.checked;tcp.textContent=g?'General':mmss(t);tcp.className='tcp'+(g?' gen':'');}
    
    if(!listEl)return;var cur=null;tops().forEach(function(n){if(n.timecode!=null&&n.timecode<=t&&t-n.timecode<6)cur=n.id;});
    [].forEach.call(listEl.querySelectorAll('.cm[data-id]'),function(e){e.classList.toggle('cur',e.getAttribute('data-id')===cur);});
  }

  function comment(n,isReply){
    var key=mine()[n.id],open=S.review.status==='open';
    var c=h('div',{class:'c'});
    var hd=h('div',{class:'hd2'},[h('b',{text:n.author_name}),n.is_team?h('span',{class:'pill y',text:'Paragraph'}):null]);
    if(!isReply){var tcb=h('button',{type:'button',class:'tc'+(n.timecode==null?' gen':''),text:n.timecode==null?'General':mmss(n.timecode)});
      if(n.timecode==null)tcb.disabled=true;else tcb.addEventListener('click',function(){video.currentTime=n.timecode;video.scrollIntoView({block:'nearest',behavior:'smooth'});});hd.appendChild(tcb);}
    hd.appendChild(h('span',{class:'w',text:ago(n.created_at)+(n.edited_at?' · edited':'')}));
    if(n.resolved)hd.appendChild(h('span',{class:'pill o',text:'Resolved'}));
    c.appendChild(hd);
    if(S.editing===n.id&&key){
      var t2=h('textarea',{maxlength:'3000'});t2.value=n.body;var m=h('span',{class:'msg'});
      var b=h('div',{class:'b'},[h('button',{class:'btn pri sm',type:'button',text:'Save',onclick:function(){
        if(!t2.value.trim()){m.textContent='A comment can’t be empty.';m.className='msg err';return;}m.textContent='Saving…';m.className='msg';
        api('POST',{action:'edit',token:token,note_id:n.id,edit_key:key,body:t2.value}).then(function(j){S.notes=S.notes.map(function(x){return x.id===n.id?j.note:x;});S.editing=null;render();}).catch(function(er){m.textContent=er.message;m.className='msg err';});}}),
        h('button',{class:'btn ghost sm',type:'button',text:'Cancel',onclick:function(){S.editing=null;render();}}),m]);
      c.appendChild(h('div',{class:'ed'},[t2,b]));setTimeout(function(){t2.focus();},0);
    }else{
      c.appendChild(h('div',{class:'tx',text:n.body}));
      var ac=h('div',{class:'acts'});
      if(!isReply&&open)ac.appendChild(h('button',{type:'button',text:'Reply',onclick:function(){S.replyOpen=n.id;render();}}));
      if(key&&open)ac.appendChild(h('button',{type:'button',text:'Edit',onclick:function(){S.editing=n.id;render();}}));
      if(ac.children.length)c.appendChild(ac);
    }
    if(!isReply){
      var kids=S.notes.filter(function(k){return k.parent_id===n.id;});
      if(kids.length){var rp=h('div',{class:'rep'});kids.forEach(function(k){rp.appendChild(comment(k,true));});c.appendChild(rp);}
      if(S.replyOpen===n.id&&open){
        var ra=h('textarea',{placeholder:'Reply…',maxlength:'3000'});var m2=h('span',{class:'msg'});
        c.appendChild(h('div',{class:'ed',style:'margin-top:8px'},[ra,h('div',{class:'b'},[
          h('button',{class:'btn pri sm',type:'button',text:'Reply',onclick:function(){send({body:ra.value,parent_id:n.id},m2,function(){S.replyOpen=null;});}}),
          h('button',{class:'btn ghost sm',type:'button',text:'Cancel',onclick:function(){S.replyOpen=null;render();}}),m2])]));setTimeout(function(){ra.focus();},0);
      }
    }
    var el=h('div',{class:'cm'+(n.resolved?' done':'')+(isReply?' r':''),'data-id':isReply?null:n.id},[avatar(n.author_name),c]);
    return el;
  }

  function render(){
    if(!listEl)return;var keepTop=listEl.scrollTop;listEl.innerHTML='';var t=tops();
    cols.classList.toggle('has-notes',S.notes.length>0);
    countEl.textContent=allTops().length;
    if(!t.length)listEl.appendChild(h('div',{class:'nonotes',text:S.filter==='all'?'No comments yet.':'Nothing here.'}));
    t.forEach(function(n){listEl.appendChild(comment(n,false));});listEl.scrollTop=keepTop;tick();
  }

  function send(payload,msg,done){
    var name=((nameIn&&nameIn.value)||store('name')||'').trim();
    if(!name){msg.textContent='Please add your name first.';msg.className='msg err';if(nameIn)nameIn.focus();return;}
    if(!(payload.body||'').trim()){msg.textContent='Write a comment first.';msg.className='msg err';return;}
    var email=((emailIn&&emailIn.value)||store('email')||'').trim();store('name',name);store('email',email);
    msg.textContent='Sending…';msg.className='msg';
    api('POST',Object.assign({token:token,name:name,email:email},payload)).then(function(j){
      if(j.edit_key)keep(j.note.id,j.edit_key);S.notes.push(j.note);if(done)done();msg.textContent='';render();marks();
    }).catch(function(e){msg.textContent=e.message;msg.className='msg err';});
  }
  function submit(){var gen=genBox.checked;send({body:ta.value,timecode:gen?null:Math.round((video.currentTime||0)*10)/10},msgEl,function(){ta.value='';ta.style.height='auto';});}

  /* ---------- presentation ---------- */

  var ICO={play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',vol:'<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>',mute:'<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9zm13 .6L14.6 11l1.4 1.4-1.4 1.4L16 15.2l1.4-1.4 1.4 1.4 1.4-1.4-1.4-1.4 1.4-1.4-1.4-1.4-1.4 1.4z"/></svg>',fs:'<svg viewBox="0 0 24 24"><path d="M5 5h5v2H7v3H5zm9 0h5v5h-2V7h-3zM5 14h2v3h3v2H5zm12 0h2v5h-5v-2h3z"/></svg>'};
  function controls(v){
    var pb=h('button',{type:'button','aria-label':'Play'}),tm=h('span',{class:'t',text:'0:00 / 0:00'}),mb=h('button',{type:'button','aria-label':'Mute'}),fb=h('button',{type:'button','aria-label':'Full screen'});
    var fill=h('div',{class:'fill'}),knob=h('div',{class:'knob',id:'head'}),seek=h('div',{class:'seek'},[fill,knob]);
    pb.innerHTML=ICO.play;mb.innerHTML=ICO.vol;fb.innerHTML=ICO.fs;
    function tg(){if(v.paused)v.play();else v.pause();}
    pb.addEventListener('click',tg);v.addEventListener('click',tg);
    v.addEventListener('play',function(){pb.innerHTML=ICO.pause;});v.addEventListener('pause',function(){pb.innerHTML=ICO.play;});
    function upd(){var d=v.duration||0,c=v.currentTime||0;tm.textContent=mmss(c)+' / '+mmss(d);var p=d?c/d*100:0;fill.style.width=p+'%';knob.style.left=p+'%';}
    ['timeupdate','loadedmetadata','durationchange','seeked'].forEach(function(e){v.addEventListener(e,upd);});
    function sk(e){var b=seek.getBoundingClientRect();if(v.duration)v.currentTime=v.duration*Math.min(1,Math.max(0,(e.clientX-b.left)/b.width));}
    var drag=false;seek.addEventListener('pointerdown',function(e){if(e.target.tagName==='I')return;drag=true;seek.setPointerCapture(e.pointerId);sk(e);});seek.addEventListener('pointermove',function(e){if(drag)sk(e);});seek.addEventListener('pointerup',function(){drag=false;});
    mb.addEventListener('click',function(){v.muted=!v.muted;mb.innerHTML=v.muted?ICO.mute:ICO.vol;});
    fb.addEventListener('click',function(){if(v.requestFullscreen)v.requestFullscreen();else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen();});
    var bar=h('div',{class:'cbar'},[pb,tm,seek,mb,fb]);bar.seek=seek;return bar;
  }
  function buildPresentation(){
    var r=S.review;var wrap=h('div');var st=player();wrap.appendChild(st);st.appendChild(controls(video));
    var big=h('button',{class:'pbig',type:'button','aria-label':'Play video'});big.innerHTML=ICO.play;st.querySelector('.vbox').appendChild(big);
    big.addEventListener('click',function(){video.play();});video.addEventListener('play',function(){big.hidden=true;});video.addEventListener('ended',function(){big.hidden=false;});
    var bar=h('div',{class:'pres'});
    bar.appendChild(h('div',null,[h('h1',{text:r.title}),h('div',{class:'sub',text:[r.client,r.project,r.label].filter(Boolean).join(' · ')})]));
    bar.appendChild(h('span',{class:'sp'}));
    var sent=store('req_'+token)==='1';
    if(r.status==='open'){
      if(r.request_status==='pending'||sent)bar.appendChild(h('span',{class:'msg',text:'Request to make notes sent. You’ll be able to comment once it’s approved.'}));
      else if(r.request_status==='declined')bar.appendChild(h('span',{class:'msg',text:'Notes weren’t enabled on this video.'}));
      else bar.appendChild(h('button',{class:'ask',type:'button',text:'Video Feedback Mode',onclick:askDlg}));
    }
    if(r.status==='open'&&r.download_url)bar.appendChild(h('a',{class:'btn pri',href:r.download_url,rel:'noopener',download:'',text:'Download video',onclick:function(){try{sessionStorage.removeItem('pgt_download_'+token);}catch(e){}track('download');}}));
    wrap.appendChild(bar);app.appendChild(wrap);
  }
  function askDlg(){
    var n=h('input',{class:'field',placeholder:'Your name',value:store('name'),maxlength:'80'}),e=h('input',{class:'field',type:'email',placeholder:'Email',value:store('email'),maxlength:'160'}),t=h('textarea',{class:'field',placeholder:'Anything you’d like to add? (optional)',maxlength:'600'}),m=h('span',{class:'msg'});
    var o=h('div',{class:'ov'},[h('div',{class:'md'},[h('h3',{text:'Video Feedback Mode'}),h('p',{text:'Paragraph will approve your request, and then this page becomes a review page where you can leave timecoded notes.'}),
      h('div',{class:'stack'},[n,e,t]),
      h('div',{class:'btns'},[h('button',{class:'btn pri',type:'button',text:'Send request',onclick:function(){
        if(!n.value.trim()){m.textContent='Please add your name.';m.className='msg err';return;}
        store('name',n.value.trim());store('email',e.value.trim());m.textContent='Sending…';m.className='msg';
        api('POST',{action:'request_notes',token:token,name:n.value,email:e.value,message:t.value}).then(function(){store('req_'+token,'1');o.remove();S.review.request_status='pending';build();}).catch(function(er){m.textContent=er.message;m.className='msg err';});}}),
        h('button',{class:'btn ghost',type:'button',text:'Cancel',onclick:function(){o.remove();}}),m])])]);
    o.addEventListener('click',function(ev){if(ev.target===o)o.remove();});document.body.appendChild(o);setTimeout(function(){n.focus();},30);
  }

  /* ---------- polling ---------- */
  function poll(){
    if(document.hidden)return;
    api('GET').then(function(j){
      var prev=S.review;
      if(j.review.kind!==prev.kind||j.review.request_status!==prev.request_status||j.review.status!==prev.status){var t=video?video.currentTime:0;S.review=j.review;S.notes=j.notes;build();if(video&&t&&S.review.kind==='review'){video.addEventListener('loadedmetadata',function(){video.currentTime=t;},{once:true});}return;}
      var busy=S.editing||S.replyOpen||(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('.ed'));
      var sig=function(a){return JSON.stringify(a.map(function(n){return [n.id,n.resolved,n.edited_at,n.body];}));};
      S.review=j.review;if(sig(j.notes)!==sig(S.notes)&&!busy){S.notes=j.notes;if(listEl){render();marks();}}
    }).catch(function(){});
  }

  if(!token)return fail('The link looks incomplete. Please ask Paragraph for a new one.');
  api('GET').then(function(j){S.review=j.review;S.notes=j.notes;build();track('view');setInterval(poll,20000);}).catch(function(e){fail(e.message);});
})();
</script>
</body></html>
